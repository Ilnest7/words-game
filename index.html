<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Цепочка слов</title>
<style>
:root{color-scheme:dark;--bg:#0f172a;--panel:#1e293b;--panel2:#0b1222;--line:#334155;--blue:#38bdf8;--pink:#fb7185;--green:#34d399;--muted:#94a3b8}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(ellipse at top,#1e3a5f 0%,var(--bg) 55%);color:#e2e8f0;margin:0;padding:24px;min-height:100vh;display:grid;place-items:center}
.game{width:min(100%,560px);background:rgba(30,41,59,.97);border:1px solid #3b4c65;border-radius:22px;padding:clamp(18px,4vw,30px);box-shadow:0 22px 70px #02061799}
header{display:flex;justify-content:center;align-items:center}
h1{margin:0;color:var(--blue);font-size:clamp(25px,5vw,34px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0}
.stat{background:var(--panel2);border:1px solid var(--line);padding:11px;border-radius:12px;text-align:center}
.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:21px;color:var(--green);font-variant-numeric:tabular-nums}
.target{background:linear-gradient(135deg,#0b1222,#111e34);border:1px solid #263a55;padding:18px;border-radius:16px;text-align:center;margin:16px 0}
.target-label{color:var(--muted);font-size:13px}.last{font-size:20px;font-weight:700;margin:5px 0 12px;overflow-wrap:anywhere}
.letter{font-size:48px;line-height:1.1;color:var(--pink);font-weight:850;text-shadow:0 0 24px #fb718555}
.timer-wrap{margin:16px 0 4px}.timer-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:7px}
.track{height:8px;background:#334155;border-radius:20px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:20px;transition:width .2s linear,background .2s}
.message{min-height:26px;margin:15px 0;text-align:center;color:#cbd5e1}.error{color:#f87171}.success{color:#4ade80}
.controls{display:flex;gap:9px}.controls input{min-width:0;flex:1}
input,select{font:inherit;padding:12px 13px;border-radius:10px;background:#0f172a;border:1px solid #475569;color:white;outline:none}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #38bdf822}
button{font:inherit;border:0;border-radius:10px;padding:12px 17px;background:var(--blue);color:#082f49;font-weight:800;cursor:pointer;transition:transform .15s,filter .15s}
button:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed}
.secondary{background:#475569;color:white}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.settings label{font-size:12px;color:var(--muted);display:grid;gap:6px}
.history{margin-top:15px;background:#0f172a;padding:13px;border:1px solid var(--line);border-radius:12px;display:flex;flex-wrap:wrap;gap:8px;max-height:170px;overflow:auto;align-content:flex-start}
.word{padding:6px 10px;border-radius:20px;background:#1e293b;border:1px solid #475569;font-size:13px;animation:pop .22s ease-out}
.player{border-color:#0e7490;color:#7dd3fc}.bot{border-color:#9f1239;color:#fda4af}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(5px)}to{opacity:1;transform:scale(1) translateY(0)}}
.bottom{display:flex;gap:9px;margin-top:13px}.bottom button{flex:1}
.details{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.detail{background:#0f172a;border-radius:10px;padding:10px;text-align:center}.detail b{display:block;color:var(--blue);font-size:18px}.detail small{color:var(--muted);font-size:11px}
@media(max-width:430px){body{padding:12px}.controls button{padding-inline:13px}.details{gap:5px}.detail{padding:8px 4px}}
</style>
</head>
<body>
<main class="game">
  <header><h1>Цепочка слов</h1></header>
  <section class="stats">
    <div class="stat"><small>Очки</small><strong id="score">0</strong></div>
    <div class="stat"><small>Рекорд</small><strong id="best">0</strong></div>
    <div class="stat"><small>Сложность</small><strong id="levelLabel" style="font-size:15px">Средняя</strong></div>
  </section>
  <div class="settings">
    <label>Сложность
      <select id="difficulty"><option value="easy">Лёгкая</option><option value="medium" selected>Средняя</option><option value="hard">Сложная</option></select>
    </label>
    <label>Время на ход
      <select id="timeLimit"><option value="15">15 секунд</option><option value="20">20 секунд</option><option value="30" selected>30 секунд</option><option value="45">45 секунд</option><option value="0">Без таймера</option></select>
    </label>
  </div>
  <section class="target">
    <div class="target-label">Предыдущее слово</div>
    <div class="last" id="lastWord">—</div>
    <div class="target-label">Твоя буква</div>
    <div class="letter" id="letter">…</div>
  </section>
  <div class="timer-wrap">
    <div class="timer-row"><span>Время на ответ</span><b id="timerText">30 сек.</b></div>
    <div class="track"><div class="fill" id="timerFill"></div></div>
  </div>
  <div class="message" id="message" role="status" aria-live="polite">Загружаем словарь…</div>
  <div class="controls">
    <input id="wordInput" type="text" placeholder="Введи существительное" autocomplete="off" disabled>
    <button id="ok" disabled>Ответить</button>
  </div>
  <div class="history" id="history" aria-label="История слов"></div>
  <div class="bottom">
    <button class="secondary" id="reset" disabled>Новая игра</button>
    <button class="secondary" id="statsButton">Статистика</button>
  </div>
  <section class="details" id="statsPanel" hidden>
    <div class="detail"><b id="wins">0</b><small>Победы</small></div>
    <div class="detail"><b id="losses">0</b><small>Поражения</small></div>
    <div class="detail"><b id="played">0</b><small>Всего игр</small></div>
  </section>
</main>
<script>
"use strict";

// Основной и запасной источники списка существительных (по одному слову в строке)
const NOUNS_URLS = [
  "https://raw.githubusercontent.com/Harrix/Russian-Nouns/main/dist/russian_nouns.txt",
  "https://raw.githubusercontent.com/Badestrand/russian-dictionary/master/nouns.txt"
];

const $ = id => document.getElementById(id);
const STORAGE_KEY = "wordChainStatsV3";
const MIN_DICTIONARY_SIZE = 1000;

let dictionary = [];
let wordSet = new Set();
let byFirstLetter = new Map();
let used = new Set();
let score = 0;
let nextLetter = "";
let gameOver = true;
let botThinking = false;
let timerId = null;
let remaining = 30;
let turnStartedAt = 0;
let gameRecorded = false;

// Нормализация: верхний регистр, ё -> е, только буквы
function normalizeWord(value) {
  return String(value || "")
    .trim()
    .toLocaleUpperCase("ru-RU")
    .replace(/Ё/g, "Е")
    .replace(/[^А-Я]/g, "");
}

// Принимаем слово, если это 2+ русских буквы
function isValidWord(word) {
  return /^[А-Я]{2,}$/.test(word);
}

// Строим словарь из текста «одно слово в строке»
function buildNounDictionary(text) {
  const set = new Set();
  for (const line of text.split(/\r?\n/)) {
    const word = normalizeWord(line);
    if (isValidWord(word)) set.add(word);
  }
  return [...set];
}

function loadStats() {
  const fallback = {wins:0, losses:0, played:0, best:{easy:0,medium:0,hard:0}};
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return saved
      ? {...fallback, ...saved, best:{...fallback.best, ...(saved.best || {})}}
      : fallback;
  } catch { return fallback; }
}

let stats = loadStats();

function saveStats() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); } catch {}
  updateStatsUI();
}

function updateStatsUI() {
  $("wins").textContent = stats.wins;
  $("losses").textContent = stats.losses;
  $("played").textContent = stats.played;
  $("best").textContent = stats.best[$("difficulty").value] || 0;
}

function getLastLetter(word) {
  for (let i = word.length - 1; i >= 0; i--) {
    if (!"ЬЪЫ".includes(word[i])) return word[i];
  }
  return "";
}

function buildIndex() {
  byFirstLetter = new Map();
  for (const word of dictionary) {
    if (!byFirstLetter.has(word[0])) byFirstLetter.set(word[0], []);
    byFirstLetter.get(word[0]).push(word);
  }
}

function candidatesFor(letter) {
  return (byFirstLetter.get(letter) || []).filter(word => !used.has(word));
}

function setMessage(text, type = "") {
  $("message").textContent = text;
  $("message").className = "message " + type;
}

function addHistory(word, type) {
  const el = document.createElement("span");
  el.className = "word " + type;
  el.textContent = (type === "player" ? "👤 " : "🤖 ") + word;
  $("history").appendChild(el);
  $("history").scrollTop = $("history").scrollHeight;
}

function updateTarget(word) {
  nextLetter = getLastLetter(word);
  $("lastWord").textContent = word;
  $("letter").textContent = nextLetter;
}

function stopTimer() {
  if (timerId) { clearInterval(timerId); timerId = null; }
}

function renderTimer() {
  const limit = Number($("timeLimit").value) || 30;
  const percent = Math.max(0, (remaining / limit) * 100);
  $("timerText").textContent = Math.ceil(remaining) + " сек.";
  $("timerFill").style.width = percent + "%";
  $("timerFill").style.background = percent < 25
    ? "#fb7185"
    : "linear-gradient(90deg,#34d399,#38bdf8)";
}

function startTimer() {
  stopTimer();
  const limit = Number($("timeLimit").value);
  remaining = limit;
  if (!limit) {
    $("timerText").textContent = "∞";
    $("timerFill").style.width = "100%";
    return;
  }
  turnStartedAt = Date.now();
  renderTimer();
  timerId = setInterval(() => {
    remaining = Math.max(0, limit - (Date.now() - turnStartedAt) / 1000);
    renderTimer();
    if (remaining <= 0) {
      stopTimer();
      finishGame(false, "Время вышло! Ты не успел ответить.");
    }
  }, 100);
}

function enableInput(enabled) {
  $("wordInput").disabled = !enabled;
  $("ok").disabled = !enabled;
}

function resetGame() {
  stopTimer();
  botThinking = false;
  gameOver = false;
  gameRecorded = false;
  used = new Set();
  score = 0;
  $("score").textContent = "0";
  $("history").innerHTML = "";
  $("wordInput").value = "";
  enableInput(true);
  const start = dictionary[Math.floor(Math.random() * dictionary.length)];
  used.add(start);
  updateTarget(start);
  addHistory(start, "bot");
  setMessage("Твой ход! Назови существительное на букву «" + nextLetter + "».");
  startTimer();
  $("wordInput").focus();
}

function finishGame(playerWon, message) {
  if (gameOver) return;
  gameOver = true;
  botThinking = false;
  stopTimer();
  enableInput(false);
  setMessage(message, playerWon ? "success" : "error");
  if (!gameRecorded) {
    gameRecorded = true;
    stats.played++;
    if (playerWon) stats.wins++; else stats.losses++;
    const level = $("difficulty").value;
    stats.best[level] = Math.max(stats.best[level] || 0, score);
    saveStats();
  }
}

function chooseBotWord(letter) {
  const choices = candidatesFor(letter);
  if (!choices.length) return null;
  const level = $("difficulty").value;
  if (level === "easy") return choices[Math.floor(Math.random() * choices.length)];

  const scored = choices.map(word => {
    const ending = getLastLetter(word);
    const replies = candidatesFor(ending).length;
    return {word, replies};
  }).sort((a, b) => a.replies - b.replies);

  if (level === "medium") {
    const pool = scored.slice(0, Math.max(1, Math.ceil(scored.length * 0.35)));
    return pool[Math.floor(Math.random() * pool.length)].word;
  }
  const minimum = scored[0].replies;
  const best = scored.filter(item => item.replies === minimum);
  return best[Math.floor(Math.random() * best.length)].word;
}

function botTurn(letter) {
  if (gameOver) return;
  const word = chooseBotWord(letter);
  if (!word) {
    finishGame(true, "🤖 У меня нет подходящего существительного. Ты победил! 🎉");
    return;
  }
  used.add(word);
  updateTarget(word);
  addHistory(word, "bot");
  botThinking = false;
  enableInput(true);
  setMessage("Мой ход: " + word + ". Теперь твоя очередь!");
  startTimer();
  $("wordInput").focus();
}

function playWord() {
  if (gameOver || botThinking) return;
  const word = normalizeWord($("wordInput").value);
  $("wordInput").value = "";
  if (!word) return;
  if (!isValidWord(word)) { setMessage("Вводи только русские буквы (2+ символа).", "error"); return; }
  if (used.has(word)) { setMessage("Это слово уже использовалось.", "error"); return; }
  if (word[0] !== nextLetter) { setMessage("Нужно слово на букву «" + nextLetter + "».", "error"); return; }
  if (!wordSet.has(word)) { setMessage("Такого существительного нет в словаре.", "error"); return; }

  stopTimer();
  used.add(word);
  score += 10;
  $("score").textContent = score;
  addHistory(word, "player");
  botThinking = true;
  enableInput(false);
  setMessage("🤖 Подбираю существительное…");
  window.setTimeout(() => botTurn(getLastLetter(word)), 450);
}

async function fetchDictionaryText() {
  let lastError = null;
  for (const url of NOUNS_URLS) {
    try {
      const response = await fetch(url, {cache: "force-cache"});
      if (!response.ok) throw new Error("HTTP " + response.status);
      const text = await response.text();
      if (text.trim().startsWith("<")) throw new Error("Получен HTML вместо словаря");
      return text;
    } catch (error) {
      lastError = error;
      console.warn("Источник словаря недоступен:", url, error);
    }
  }
  throw lastError || new Error("Все источники недоступны");
}

async function loadDictionary() {
  try {
    const text = await fetchDictionaryText();
    dictionary = buildNounDictionary(text);
    if (dictionary.length < MIN_DICTIONARY_SIZE) {
      throw new Error("Словарь загрузился не полностью: " + dictionary.length + " слов");
    }
    wordSet = new Set(dictionary);
    buildIndex();
    $("reset").disabled = false;
    updateStatsUI();
    resetGame();
  } catch (error) {
    console.error(error);
    setMessage("Не удалось загрузить словарь существительных. Проверь интернет и обнови страницу.", "error");
  }
}

$("ok").addEventListener("click", playWord);
$("wordInput").addEventListener("keydown", event => {
  if (event.key === "Enter") playWord();
});
$("reset").addEventListener("click", resetGame);

$("difficulty").addEventListener("change", () => {
  $("levelLabel").textContent = {easy:"Лёгкая",medium:"Средняя",hard:"Сложная"}[$("difficulty").value];
  updateStatsUI();
  if (!gameOver && dictionary.length) resetGame();
});

$("timeLimit").addEventListener("change", () => {
  if (!gameOver && !botThinking) startTimer();
});

$("statsButton").addEventListener("click", () => {
  const panel = $("statsPanel");
  panel.hidden = !panel.hidden;
  $("statsButton").textContent = panel.hidden ? "Статистика" : "Скрыть статистику";
});

$("levelLabel").textContent = "Средняя";
updateStatsUI();
loadDictionary();
</script>
</body>
</html>
