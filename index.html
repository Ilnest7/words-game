
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра в Слова: Цепочка</title>

    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .game-container {
            background: #1e293b;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0,0,0,.4);
            text-align: center;
            border: 1px solid #334155;
        }

        h1 {
            color: #38bdf8;
            margin-top: 0;
        }

        .rules-link {
            color: #94a3b8;
            cursor: pointer;
            text-decoration: underline;
            margin-bottom: 20px;
            display: inline-block;
        }

        .word-chain-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .current-target {
            font-size: 1.1rem;
            color: #94a3b8;
        }

        .letter-highlight {
            font-size: 2.2rem;
            font-weight: bold;
            color: #f43f5e;
            display: block;
            margin-top: 5px;
        }

        .score-board {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #34d399;
            font-weight: bold;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 1rem;
        }

        .btn {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-main {
            background: #38bdf8;
            color: #0f172a;
        }

        .btn-refresh {
            background: #475569;
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .message {
            min-height: 25px;
            font-size: .9rem;
            margin-bottom: 15px;
        }

        .success { color: #4ade80; }
        .error { color: #f87171; }

        .history-box {
            background: #0f172a;
            border-radius: 8px;
            padding: 15px;
            max-height: 140px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            border: 1px solid #334155;
            justify-content: center;
        }

        .word-badge {
            background: #1e293b;
            color: #e2e8f0;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: .9rem;
            border: 1px solid #334155;
        }

        .word-badge.player {
            border-color: #38bdf8;
            color: #38bdf8;
        }

        .word-badge.bot {
            border-color: #f43f5e;
            color: #f43f5e;
        }

        .word-badge.start {
            border-color: #34d399;
            color: #34d399;
        }
    </style>
</head>

<body>

<div class="game-container">

    <h1>Цепочка Слов</h1>

    <span class="rules-link" id="rulesBtn">
        Показать правила
    </span>

    <div class="score-board">
        Твои Очки: <span id="score">0</span>
    </div>

    <div class="word-chain-box">

        <div class="current-target">
            Предыдущее слово:
            <b id="lastWord">Загрузка...</b>
        </div>

        <div class="current-target" style="margin-top:10px;">
            Ждем твое слово на букву:
        </div>

        <span class="letter-highlight" id="targetLetter">...</span>

    </div>

    <div class="message" id="message">
        Загружаем словарь...
    </div>

    <div class="input-group">

        <input
            type="text"
            id="wordInput"
            placeholder="Введите существительное..."
            autocomplete="off"
            disabled
        >

        <button class="btn btn-main" id="okBtn" disabled>
            ОК
        </button>

    </div>

    <div class="history-box" id="historyBox"></div>

    <button class="btn btn-refresh" id="newWordBtn" disabled>
        🔄 Начать заново
    </button>

</div>

<script>

// ======================================
// НАСТРОЙКИ ВНЕШНЕЙ БИБЛИОТЕКИ
// ======================================

// Укажи ссылку на свой JSON-файл GitHub
const DICTIONARY_URL =
    "https://raw.githubusercontent.com/USERNAME/word-chain/main/data/words.json";

// ======================================
// ПЕРЕМЕННЫЕ ИГРЫ
// ======================================

let dictionary = [];

let currentWord = "";
let nextLetter = "";
let score = 0;
let usedWords = new Set();
let gameOver = false;

const $ = id => document.getElementById(id);

// ======================================
// ЗАГРУЗКА СЛОВАРЯ С GITHUB
// ======================================

async function loadDictionary() {

    try {

        $("message").innerText = "Загружаем словарь с GitHub...";

        const response = await fetch(DICTIONARY_URL);

        if (!response.ok) {
            throw new Error("Ошибка загрузки словаря");
        }

        const data = await response.json();

        if (!Array.isArray(data) || data.length === 0 ||
            !data.every(word => typeof word === "string")) {
            throw new Error("Неверный формат словаря");
        }

        dictionary = [...new Set(
            data.map(word => word.trim().toUpperCase())
                .filter(word => /^[А-ЯЁ]+$/.test(word))
        )];

        if (dictionary.length === 0) {
            throw new Error("В словаре нет подходящих слов");
        }

        $("wordInput").disabled = false;
        $("okBtn").disabled = false;
        $("newWordBtn").disabled = false;

        resetGame();

    } catch (error) {

        console.error(error);

        $("message").innerText =
            "Не удалось загрузить словарь с GitHub!";

        $("message").className = "message error";

    }
}

// ======================================
// ПОЛУЧЕНИЕ ПОСЛЕДНЕЙ БУКВЫ
// ======================================

function getValidLastLetter(word) {

    let idx = word.length - 1;

    const badLetters = ["Ь", "Ъ", "Ы"];

    while (
        idx >= 0 &&
        badLetters.includes(word[idx])
    ) {
        idx--;
    }

    return word[idx] || "";
}

// ======================================
// ХОД КОМПЬЮТЕРА
// ======================================

function botTurn(letter) {

    const validBotWords = dictionary.filter(word =>
        word.startsWith(letter) &&
        !usedWords.has(word)
    );

    if (validBotWords.length === 0) {

        $("message").innerText =
            "🤖 У меня кончились слова! Ты победил! 🎉";

        $("message").className = "message success";

        gameOver = true;

        return false;
    }

    const botWord = validBotWords[
        Math.floor(Math.random() * validBotWords.length)
    ];

    usedWords.add(botWord);

    currentWord = botWord;
    nextLetter = getValidLastLetter(botWord);

    $("lastWord").innerText = currentWord;
    $("targetLetter").innerText = nextLetter;

    addWordToHistory(botWord, "bot");

    return true;
}

// ======================================
// ИСТОРИЯ СЛОВ
// ======================================

function addWordToHistory(word, type) {

    const badge = document.createElement("span");

    badge.className = "word-badge " + type;

    badge.innerText =
        (type === "player" ? "👤 " : "🤖 ") + word;

    $("historyBox").appendChild(badge);
}

// ======================================
// НОВАЯ ИГРА
// ======================================

function resetGame() {

    if (!dictionary.length) return;

    const randWord = dictionary[
        Math.floor(Math.random() * dictionary.length)
    ];

    currentWord = randWord;
    nextLetter = getValidLastLetter(randWord);

    score = 0;
    gameOver = false;

    usedWords = new Set([randWord]);

    $("score").innerText = score;
    $("lastWord").innerText = currentWord;
    $("targetLetter").innerText = nextLetter;

    $("message").innerText = "Новая игра! Твой ход.";
    $("message").className = "message";

    $("wordInput").value = "";

    $("historyBox").innerHTML = "";

    const badge = document.createElement("span");

    badge.className = "word-badge start";
    badge.innerText = "🤖 " + randWord;

    $("historyBox").appendChild(badge);
}

// ======================================
// ХОД ИГРОКА
// ======================================

function playWord() {

    if (gameOver || !dictionary.length) return;

    const input = $("wordInput");
    const msg = $("message");

    let word = input.value
        .replace(/[\s\n\r]/g, "")
        .toUpperCase();

    if (!word) return;

    input.value = "";

    if (word.includes("-")) {
        msg.innerText = "Слова с дефисом запрещены!";
        msg.className = "message error";
        return;
    }

    if (usedWords.has(word)) {
        msg.innerText = "Это слово уже было в игре!";
        msg.className = "message error";
        return;
    }

    if (word.charAt(0) !== nextLetter) {
        msg.innerText =
            `Слово должно начинаться на букву "${nextLetter}"`;

        msg.className = "message error";
        return;
    }

    if (!dictionary.includes(word)) {
        msg.innerText =
            "Я не знаю такого слова в своей библиотеке!";

        msg.className = "message error";
        return;
    }

    usedWords.add(word);

    score += 10;

    $("score").innerText = score;

    addWordToHistory(word, "player");

    const botLetter = getValidLastLetter(word);

    msg.innerText = "Робот думает...";
    msg.className = "message success";

    setTimeout(() => {

        if (botTurn(botLetter)) {

            msg.innerText = "Твой ход!";
            msg.className = "message";

        }

    }, 400);
}

// ======================================
// СОБЫТИЯ
// ======================================

$("okBtn").addEventListener("click", playWord);

$("newWordBtn").addEventListener("click", resetGame);

$("wordInput").addEventListener("keydown", event => {

    if (event.key === "Enter") {
        playWord();
    }

});

$("rulesBtn").addEventListener("click", () => {

    alert(
        "ПРАВИЛА:\n\n" +
        "1. Называй слова из списка на нужную букву.\n" +
        "2. Робот ответит словом из этого же списка.\n" +
        "3. Повторять слова нельзя.\n" +
        "4. За каждое правильное слово +10 очков."
    );

});

// ======================================
// ЗАПУСК
// ======================================

loadDictionary();

</script>

</body>
</html>
