
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цепочка слов</title>
<style>
body{font-family:system-ui;background:#0f172a;color:#e2e8f0;margin:0;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh;box-sizing:border-box}
.game{background:#1e293b;border-radius:16px;padding:30px;width:100%;max-width:480px;text-align:center;border:1px solid #334155}
h1{color:#38bdf8}
.target{background:#0f172a;padding:20px;border-radius:10px;margin:20px 0}
.letter{font-size:40px;color:#f43f5e;font-weight:bold}
.score{color:#34d399;font-weight:bold}
.input{display:flex;gap:10px}
input{min-width:0;flex:1;padding:12px;border-radius:8px;background:#0f172a;border:2px solid #334155;color:white}
button{padding:12px 20px;border:0;border-radius:8px;background:#38bdf8;font-weight:bold;cursor:pointer}
.history{margin-top:15px;background:#0f172a;padding:15px;border-radius:8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-height:150px;overflow:auto}
.word{padding:5px 10px;border-radius:15px;background:#1e293b;border:1px solid #475569}
.player{color:#38bdf8}.bot{color:#f43f5e}
.message{min-height:25px;margin:15px 0}
.error{color:#f87171}.success{color:#4ade80}
.reset{width:100%;margin-top:15px;background:#475569;color:white}
</style>
</head>
<body>
<div class="game">
<h1>Цепочка слов</h1>
<p class="score">Очки: <span id="score">0</span></p>
<div class="target">
<div>Предыдущее слово: <b id="lastWord">Загрузка...</b></div>
<p>Твоя буква:</p>
<div class="letter" id="letter">...</div>
</div>
<div class="message" id="message">Загрузка словаря...</div>
<div class="input">
<input id="wordInput" placeholder="Введи существительное" disabled>
<button id="ok" disabled>ОК</button>
</div>
<div class="history" id="history"></div>
<button class="reset" id="reset" disabled>Начать заново</button>
</div>

<script>
const DICTIONARY_URL =
"https://raw.githubusercontent.com/danakt/russian-words/master/russian.txt";

let dictionary=[];
let used=new Set();
let score=0;
let currentWord="";
let nextLetter="";
let gameOver=false;

const $=id=>document.getElementById(id);

async function loadDictionary(){
try{
const response=await fetch(DICTIONARY_URL);
if(!response.ok)throw Error("Ошибка загрузки");
const text=await response.text();

dictionary=[...new Set(
text.split(/\r?\n/)
.map(w=>w.trim().toUpperCase())
.filter(w=>/^[А-ЯЁ]+$/.test(w)&&w.length>1)
)];

if(!dictionary.length)throw Error("Пустой словарь");

$("wordInput").disabled=false;
$("ok").disabled=false;
$("reset").disabled=false;
resetGame();

}catch(e){
$("message").textContent="Не удалось загрузить словарь!";
$("message").className="message error";
console.error(e);
}
}

function getLastLetter(word){
let i=word.length-1;
while(i>=0&&"ЬЪЫ".includes(word[i]))i--;
return word[i]||"";
}

function addHistory(word,type){
const el=document.createElement("span");
el.className="word "+type;
el.textContent=(type==="player"?"👤 ":"🤖 ")+word;
$("history").appendChild(el);
}

function updateTarget(word){
currentWord=word;
nextLetter=getLastLetter(word);
$("lastWord").textContent=word;
$("letter").textContent=nextLetter;
}

function resetGame(){
const word=dictionary[Math.floor(Math.random()*dictionary.length)];
used=new Set([word]);
score=0;
gameOver=false;
$("score").textContent=0;
$("history").innerHTML="";
$("wordInput").value="";
$("message").textContent="Твой ход!";
$("message").className="message";
updateTarget(word);
addHistory(word,"bot");
}

function botTurn(letter){
const candidates=dictionary.filter(w=>
w.startsWith(letter)&&!used.has(w)
);

if(!candidates.length){
$("message").textContent="🤖 Я проиграл! Ты победил! 🎉";
$("message").className="message success";
gameOver=true;
return;
}

const word=candidates[Math.floor(Math.random()*candidates.length)];
used.add(word);
updateTarget(word);
addHistory(word,"bot");
$("message").textContent="Твой ход!";
$("message").className="message";
}

function playWord(){
if(gameOver)return;

const word=$("wordInput").value.trim().toUpperCase().replace(/\s/g,"");
$("wordInput").value="";

if(!word)return;

if(!/^[А-ЯЁ]+$/.test(word)){
showError("Вводи только русские буквы!");
return;
}

if(used.has(word)){
showError("Это слово уже использовалось!");
return;
}

if(word[0]!==nextLetter){
showError("Нужно слово на букву "+nextLetter);
return;
}

if(!dictionary.includes(word)){
showError("Такого слова нет в словаре!");
return;
}

used.add(word);
score+=10;
$("score").textContent=score;
addHistory(word,"player");

const letter=getLastLetter(word);
$("message").textContent="Робот думает...";

setTimeout(()=>botTurn(letter),400);
}

function showError(text){
$("message").textContent=text;
$("message").className="message error";
}

$("ok").addEventListener("click",playWord);
$("wordInput").addEventListener("keydown",e=>{
if(e.key==="Enter")playWord();
});
$("reset").addEventListener("click",resetGame);

loadDictionary();
</script>
</body>
</html>
