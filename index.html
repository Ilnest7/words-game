<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цепочка Слов</title>
    
    <style>
        /* Переменные для динамической смены тем */
        .theme-dark { --bg-body: #0f172a; --bg-card: #1e293b; --text: #e2e8f0; --border: #334155; --primary: #38bdf8; --accent: #f43f5e; --input-bg: #0f172a; }
        .theme-light { --bg-body: #f1f5f9; --bg-card: #ffffff; --text: #1e293b; --border: #cbd5e1; --primary: #0284c7; --accent: #e11d48; --input-bg: #f8fafc; }
        .theme-cyberpunk { --bg-body: #1a0033; --bg-card: #000000; --text: #00ffcc; --border: #ff007f; --primary: #ff007f; --accent: #00ffcc; --input-bg: #1a0033; }

        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-body); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; transition: all 0.3s ease; }
        .theme-selector-container { margin-bottom: 15px; }
        .btn-theme { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .btn-theme:hover { border-color: var(--primary); }

        .game-container { background-color: var(--bg-card); border-radius: 16px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid var(--border); text-align: left; }
        h1 { color: var(--primary); margin-top: 0; font-size: 1.8rem; text-align: center; margin-bottom: 10px; }
        .rules-link { color: var(--text); opacity: 0.7; font-size: 0.9rem; cursor: pointer; text-decoration: underline; margin-bottom: 20px; display: block; text-align: center; }
        .info-line { font-size: 1.1rem; margin-bottom: 10px; }
        .letter-box { font-size: 1.1rem; margin-top: 15px; margin-bottom: 10px; }
        .letter-highlight { font-size: 2rem; font-weight: bold; color: var(--accent); display: block; margin-top: 5px; }
        
        .input-group { display: flex; gap: 10px; margin-top: 15px; margin-bottom: 15px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 2px solid var(--border); background-color: var(--input-bg); color: var(--text); font-size: 1rem; outline: none; text-transform: uppercase; }
        input:focus { border-color: var(--primary); }
        
        .btn { border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .btn-main { background-color: var(--primary); color: var(--bg-body); }
        .btn-refresh { background-color: var(--border); color: var(--text); width: 100%; margin-top: 20px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .message { min-height: 25px; font-size: 0.95rem; color: var(--accent); font-weight: bold; margin-top: 10px; margin-bottom: 10px; }
        
        .history-box { background-color: var(--input-bg); border-radius: 8px; padding: 15px; max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--border); }
        .word-badge { padding: 6px 12px; border-radius: 6px; font-size: 1rem; border-left: 4px solid transparent; }
        .word-badge.player { background-color: rgba(56, 189, 248, 0.1); border-left-color: var(--primary); color: var(--primary); }
        .word-badge.bot { background-color: rgba(244, 63, 94, 0.1); border-left-color: var(--accent); color: var(--accent); }
    </style>
    
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let dictionary = [];
            let currentWord = "";
            let nextLetter = "";
            let score = 0;
            let usedWords = new Set();

            // Прямое чтение внешней библиотеки слов
            fetch("https://githubusercontent.com")
                .then(res => {
                    if (!res.ok) throw new Error();
                    return res.json();
                })
                .then(data => {
                    let wordsArray = Array.isArray(data) ? data : Object.keys(data);
                    dictionary = wordsArray
                        .map(w => typeof w === 'string' ? w.trim().toUpperCase() : (w.word ? w.word.trim().toUpperCase() : ''))
                        .map(w => w.replace(/Ё/g, "Е"))
                        .filter(w => w.length >= 2 && w.length <= 15 && !w.includes("-") && !w.includes(" "));

                    document.getElementById('wordInput').disabled = false;
                    document.getElementById('okBtn').disabled = false;
                    document.getElementById('newWordBtn').disabled = false;
                    resetGame();
                }).catch(() => {
                    document.getElementById('message').innerText = "Ошибка загрузки библиотеки слов.";
                });

            function getValidLastLetter(word) {
                let idx = word.length - 1;
                while (idx >= 0 && ["Ь", "Ъ", "Ы"].includes(word[idx])) { idx--; }
                return word[idx] || "";
            }

            function botTurn(letter) {
                let validBotWords = dictionary.filter(w => w.startsWith(letter) && !usedWords.has(w));
                if (validBotWords.length === 0) {
                    document.getElementById('message').innerText = "🤖 У меня кончились слова! Ты победил! 🎉";
                    return false;
                }
                let botWord = validBotWords[Math.floor(Math.random() * validBotWords.length)];
                usedWords.add(botWord);
                currentWord = botWord;
                nextLetter = getValidLastLetter(botWord);
                
                document.getElementById('lastWord').innerText = currentWord;
                document.getElementById('targetLetter').innerText = nextLetter;
                
                let badge = document.createElement('div');
                badge.className = 'word-badge bot';
                badge.innerText = `🤖 ${botWord}`;
                document.getElementById('historyBox').appendChild(badge);
                scrollHistory();
                return true;
            }

            function resetGame() {
                if (dictionary.length === 0) return;
                let randWord = dictionary[Math.floor(Math.random() * dictionary.length)];
                currentWord = randWord;
                nextLetter = getValidLastLetter(randWord);
                score = 0;
                usedWords = new Set([randWord]);
                
                document.getElementById('score').innerText = score;
                document.getElementById('lastWord').innerText = currentWord;
                document.getElementById('targetLetter').innerText = nextLetter;
                document.getElementById('message').innerText = "";
                document.getElementById('wordInput').value = "";
                
                let historyBox = document.getElementById('historyBox');
                historyBox.innerHTML = `<div class="word-badge bot">🤖 ${randWord}</div>`;
            }

            function playWord() {
                const input = document.getElementById('wordInput');
                const msg = document.getElementById('message');
                
                let word = input.value.replace(/[\s\n\r]/g, "").toUpperCase().replace(/Ё/g, "Е");
                if (!word) return;
                input.value = "";

                if (word.charAt(0) !== nextLetter || usedWords.has(word) || !dictionary.includes(word)) {
                    msg.innerText = "Ошибка! Проверь букву, правила или повтор.";
                    return;
                }

                msg.innerText = "";
                usedWords.add(word);
                score += 10;
                document.getElementById('score').innerText = score;
                
                let badge = document.createElement('div');
                badge.className = 'word-badge player';
                badge.innerText = `👤 ${word}`;
                document.getElementById('historyBox').appendChild(badge);
                scrollHistory();
                
                let botLetter = getValidLastLetter(word);
                
                setTimeout(() => {
                    botTurn(botLetter);
                }, 400);
            }

            function scrollHistory() {
                const box = document.getElementById('historyBox');
                box.scrollTop = box.scrollHeight;
            }

            const themes = ['theme-dark', 'theme-light', 'theme-cyberpunk'];
            let currentThemeIdx = 0;
            
            document.getElementById('themeBtn').addEventListener('click', function() {
                document.body.classList.remove(themes[currentThemeIdx]);
                currentThemeIdx = (currentThemeIdx + 1) % themes.length;
                document.body.classList.add(themes[currentThemeIdx]);
                
                const themeNames = ['Тёмная', 'Светлая', 'Киберпанк'];
                this.innerText = `🎨 Тема: ${themeNames[currentThemeIdx]}`;
            });

            document.getElementById('okBtn').addEventListener('click', playWord);
            document.getElementById('newWordBtn').addEventListener('click', resetGame);
            document.getElementById('rulesBtn').addEventListener('click', function() { 
                alert('Правила: Называй реальные существительные. Каждое слово начинается на последнюю букву предыдущего. Буквы Ь, Ъ, Ы пропускаются. Повторяться нельзя!'); 
            });
            document.getElementById('wordInput').addEventListener('keypress', function (e) { if (e.key === 'Enter') playWord(); });
        });
    </script>
</head>
<body class="theme-dark">
