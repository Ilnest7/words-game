<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Цепочка Слов</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-slate-900 p-6 rounded-2xl shadow-xl w-full max-w-md border border-slate-800 text-center">
        <h1 class="text-2xl font-bold text-sky-400 mb-2">Цепочка Слов</h1>
        <p class="text-emerald-400 font-semibold mb-4">Очки: <span id="score">0</span></p>
        
        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 mb-4">
            <p class="text-sm text-slate-400">Слово: <b id="lastWord" class="text-white">...</b></p>
            <p class="text-sm text-slate-400 mt-2">Буква для хода:</p>
            <span id="targetLetter" class="text-4xl font-extrabold text-rose-500 uppercase">...</span>
        </div>

        <div id="msg" class="text-sm h-6 mb-3 font-medium text-slate-300">Загрузка словаря...</div>

        <div class="flex gap-2 mb-4">
            <input type="text" id="input" placeholder="Введите слово..." class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none focus:border-sky-400" disabled>
            <button onclick="play()" id="btn" class="bg-sky-400 text-slate-950 px-4 py-2 rounded-lg font-bold hover:bg-sky-300 transition cursor-pointer" disabled>ОК</button>
        </div>

        <div id="history" class="bg-slate-950 p-3 rounded-lg h-28 overflow-y-auto flex flex-wrap gap-2 justify-center border border-slate-800 text-sm"></div>
        <button onclick="init()" class="w-full mt-4 bg-slate-800 text-slate-300 py-2 rounded-lg hover:bg-slate-700 transition cursor-pointer">🔄 Заново</button>
    </div>

    <script>
        let dict = new Set(), used = new Set(), current = "", letter = "", score = 0;

        // Загружаем внешнюю большую базу русских существительных (около 30 000+ слов)
        fetch("https://raw.githubusercontent.com/danakt/russian-words/master/words.json")
            .then(res => res.json())
            .then(data => {
                // Фильтруем только существительные в верхнем регистре без дефисов
                dict = new Set(data.filter(w => w.length > 2 && !w.includes("-")).map(w => w.toUpperCase()));
                init();
                document.getElementById('input').disabled = false;
                document.getElementById('btn').disabled = false;
            });

        function getLetter(w) {
            let i = w.length - 1;
            while (i >= 0 && ["Ь", "Ъ", "Ы"].includes(w[i])) i--;
            return w[i] || "";
        }

        function init() {
            if (dict.size === 0) return;
            const arr = Array.from(dict);
            current = arr[Math.floor(Math.random() * arr.length)];
            letter = getLetter(current);
            score = 0;
            used = new Set([current]);
            
            document.getElementById('score').innerText = score;
            document.getElementById('lastWord').innerText = current;
            document.getElementById('targetLetter').innerText = letter;
            document.getElementById('msg').innerText = "Ваш ход!";
            document.getElementById('history').innerHTML = `<span class="px-2 py-1 bg-slate-900 rounded border border-emerald-500/30 text-emerald-400">🤖 ${current}</span>`;
        }

        function play() {
            const input = document.getElementById('input');
            const msg = document.getElementById('msg');
            const word = input.value.trim().toUpperCase();
            input.value = "";

            if (!word) return;
            if (used.has(word)) return msg.innerText = "Это слово уже было!";
            if (!dict.has(word)) return msg.innerText = "Такого слова нет в словаре!";
            if (word[0] !== letter) return msg.innerText = `Нужно на букву "${letter}"!`;

            used.add(word);
            score += 10;
            document.getElementById('score').innerText = score;
            addBadge(word, 'text-sky-400 border-sky-500/30');

            current = word;
            letter = getLetter(current);
            document.getElementById('lastWord').innerText = current;
            document.getElementById('targetLetter').innerText = letter;
            msg.innerText = "Робот думает...";

            setTimeout(botTurn, 400);
        }

        function botTurn() {
            const valid = Array.from(dict).filter(w => w.startsWith(letter) && !used.has(w));
            if (valid.length === 0) {
                document.getElementById('msg').innerText = "🎉 Вы победили! У бота кончились слова.";
                return;
            }
            const botWord = valid[Math.floor(Math.random() * valid.length)];
            used.add(botWord);
            current = botWord;
            letter = getLetter(current);

            document.getElementById('lastWord').innerText = current;
            document.getElementById('targetLetter').innerText = letter;
            document.getElementById('msg').innerText = "Ваш ход!";
            addBadge(botWord, 'text-rose-400 border-rose-500/30');
        }

        function addBadge(w, cls) {
            const h = document.getElementById('history');
            h.innerHTML += `<span class="px-2 py-1 bg-slate-900 rounded border ${cls}">${w}</span>`;
            h.scrollTop = h.scrollHeight;
        }

        document.getElementById('input').addEventListener('keypress', e => e.key === 'Enter' && play());
    </script>
</body>
</html>
